<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Management</title>
  <!-- External stylesheets -->
  <link rel="stylesheet" href="/style-admin.css">
  <!-- Font Awesome icons -->
  <script src="https://kit.fontawesome.com/90025d2120.js" crossorigin="anonymous"></script>
  <!-- SweetAlert2 library for enhanced popups and alerts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Header section -->
  <div class="header">
    <div class="logo-section">
      <div class="logo">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <h3>Management</h3>
    </div>

    <div class="user-section">
      <img src="/icon-event.png" />
      Event
    </div>
  </div>

  <!-- Sidebar menu with navigation links -->
  <div class="sidebar">
    <!-- for admin management -->
    <div class="menu-item">
      <a href="/user-admin" style="text-decoration: none; color: black;">
        <img src="/icon-user.png" class="menu-icon">
        <span>Admin</span>
      </a>
    </div>
    <!-- for event management  -->
    <div class="menu-item active">
      <a href="/event-admin" style="text-decoration: none; color: black;">
        <img src="/icon-event.png" class="menu-icon">
        <span>Event</span>
      </a>
    </div>
    <!-- Logout button -->
    <div class="button-container">
      <a href="/login-admin"><button class="logout-button">
          <img src="/icon-logout(white).png" class="logout-icon" />
          <span>Log Out</span>
        </button></a>
    </div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="event-header">
      <button class="add-event-btn" id="openAddEventModal">+ Add Event</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Event ID</th>
          <th>Event Image</th>
          <th>Event Name</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Category</th>
          <th>Status</th>
          <th>Location</th>
          <th>Detail</th>
          <th>Participant</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="eventTable">

      </tbody>
    </table>
  </div>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="addEventModal">
    <div class="modal-container">
      <div class="modal-header">
        <h4>Add Event</h4>
        <button class="close-btn" id="closeAddEventModal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="file" class="upload" id="eventImageUpload">

      </div>

      <div class="form-group">
        <label for="eventName">Event name</label>
        <input type="text" class="form-control yellow-bg" id="eventName" placeholder="Enter event name">
      </div>

      <div class="form-group-select">
        <label for="eventLocation">Location</label>
        <select class="form-control yellow-bg" id="eventLocation">
          <option value="" disabled selected>Select location</option>
          <option value="Skibidi Field">Skibidi Field</option>
          <option value="Skibidi Court">Skibidi Court</option>
          <option value="Skibidi Center">Skibidi Center</option>
        </select>
        <label for="eventCategory">Category</label>
        <select class="form-control yellow-bg" id="eventCategory">
          <option value="" disabled selected>Select location</option>
          <option value="Sports & Wellness">Sports & Wellness</option>
          <option value="Creative & Hobbies">Creative & Hobbies</option>
          <option value="Community & Social">Community & Social</option>
        </select>
      </div>

      <div class="form-group">
        <label for="startDate">Start Date</label>
        <div class="date-time-container">
          <input type="date" class="form-control yellow-bg date-input" id="startDate">
        </div>
      </div>

      <div class="form-group">
        <label for="endDate">End Date</label>
        <div class="date-time-container">
          <input type="date" class="form-control yellow-bg date-input" id="endDate">
        </div>
      </div>

      <div class="form-group">
        <label for="eventDetails">Detail</label>
        <textarea class="form-control yellow-bg" id="eventDetails" placeholder="Write more details..."></textarea>
      </div>

      <button class="button-add" id="addEventBtn">ADD</button>
    </div>
  </div>
  </div>

  <!-- JavaScript -->
  <script src="/event-admin.js"></script>

</body>

<!-- Axios library for making HTTP requests -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</html>
