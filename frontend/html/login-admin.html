<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - Friendly Admin</title>
  <!-- External stylesheets -->
  <link rel="stylesheet" href="/login-admin.css">
  <!-- SweetAlert2 library for pop-up alerts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="container">
    <div class="left">
      <img src="/logo.png" alt="Logo" class="logo">
    </div>
    <div class="right">
      <div class="login-box">
        <h2>Log in for administrators</h2>
        <form action="/login" method="post">
          <label>Username</label>
          <input type="text" name="username" id="username" placeholder="Username" required>
          <label>Password</label>
          <div class="password-field">
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit">Log in </button>

          <!-- Login Selection -->
          <div class="login-select">
            <button id="user" class="role-btn">User Login</button>
            <button type="button" class="role-btn">Admin Login</button>
          </div>
      </div>
    </div>
  </div>
  <!-- JavaScript -->
  <script src="/loginadmin.js">  </script>

</body>

</html>
